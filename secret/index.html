<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~*~ Zinfirik Gizli Geçit ~*~</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .secret-box {
            background: #ffffff;
            border: 3px dashed var(--main-blue);
            padding: 30px;
            margin: 20px auto;
            border-radius: 15px;
            max-width: 400px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid var(--main-blue);
            font-family: inherit;
            font-size: 1.1em;
            text-align: center;
            box-sizing: border-box;
        }
        .retro-btn {
            background: var(--main-blue);
            color: white;
            border: 2px solid var(--main-blue);
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
        }
        .retro-btn:hover {
            background: #FF4500;
            border-color: #FF4500;
        }
        .error-message {
            color: #FF4500;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <div class="header-content">
            <div class="header-title-container">
                <h1 style="font-size: clamp(1.4em, 5vw, 3em);">~*~ GİZLİ GEÇİT ~*~</h1>
            </div>
            <p><small>Devam etmek için festival alanında bulduğun şifreyi girmen gerekiyor.</small></p>
        </div>
    </div>

    <div class="main-container">
        <div class="content" style="display: block; width: 100%; text-align: center;">
            
            <div class="secret-box">
                <form id="gatekeeperForm">
                    <label for="passwordInput"><strong>ANAHTAR KELİME:</strong></label>
                    <br><br>
                    <!-- text input instead of password so they can see their funny festival codes clearly -->
                    <input type="text" id="passwordInput" placeholder="Şifreyi buraya yaz..." autocomplete="off">
                    <br>
                    <button type="submit" class="retro-btn">✨ KAPIYI AÇ ✨</button>
                </form>
                <div id="errorTxt" class="error-message">❌ Yanlış anahtar! Etrafa daha dikkatli bak...</div>
            </div>

            <p style="margin-top: 20px;"><a href="index.html">← Ana Sayfaya Dön</a></p>
        </div>
    </div>
</div>

<script>
    document.getElementById('gatekeeperForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const userInput = document.getElementById('passwordInput').value.trim().toLowerCase();
        const errorTxt = document.getElementById('errorTxt');
        
        // 🔑 SET YOUR PASSWORD HERE (Keep it lowercase)
        const secretPassword = "oyun"; 

        if (userInput === secretPassword) {
            errorTxt.style.display = 'none';
            // Pushes them directly into your new game folder!
            window.location.href = "https://www.zinfirik.com/game/";
        } else {
            errorTxt.style.display = 'block';
            // Little screen shake effect for wrong passwords
            document.querySelector('.secret-box').style.animation = 'none';
            setTimeout(() => {
                alert("Girdiğin şifre kilitleri açmadı!");
            }, 10);
        }
    });
</script>
</body>
</html>
